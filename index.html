<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đảng ủy Hải quan Quảng Ninh - KV8 | Hệ thống theo dõi công tác Đảng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  /* Mã màu chuẩn Cục Hải quan (Bảng mẫu logo): Navy #21409A · Đỏ #ED1C24 · Vàng #FFF200 */
  --navy:#21409A; --navy-deep:#182F73; --navy-soft:#E7ECF7;
  --red:#ED1C24; --red-deep:#C41219; --red-soft:#FCE9EA;
  --gold:#FFF200; --gold-ink:#8A7A00; --gold-soft:#FFFBE0; --gold-line:#E8DD8A;
  --paper:#F4F5F9; --card:#FFFFFF;
  --ink:#1B2536; --muted:#6B7385; --line:#DEE3EE;
  --green:#1E7D3A; --green-soft:#E5F3E9;
  --amber:#B26A00; --amber-soft:#FBF0DD;
  --serif:'Times New Roman','Cambria',Georgia,'Be Vietnam Pro',serif;
  --sans:'Segoe UI','Tahoma',-apple-system,'Helvetica Neue','Be Vietnam Pro',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:'kern' 1;font-variant-ligatures:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;min-width:248px;background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side-head{padding:22px 14px 16px;border-bottom:1px solid rgba(255,255,255,.18);text-align:center}
.side-head img.logo{width:64px;height:64px;display:block;margin:0 auto;padding:4px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.28)}
.side-head h1{font-family:var(--serif);font-size:13.5px;font-weight:700;letter-spacing:.2px;margin-top:8px;line-height:1.4;padding:0 6px;text-wrap:balance}
.side-head p{font-size:11px;color:rgba(255,255,255,.75);margin-top:4px;letter-spacing:.6px;text-transform:uppercase}
.nav{padding:10px 8px;flex:1}
.nav button{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.88);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.35;margin-bottom:2px;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button.active{background:var(--gold);color:var(--navy-deep);font-weight:700}
.nav .num{font-family:var(--serif);font-weight:700;font-size:12px;min-width:16px;opacity:.85;padding-top:1px}
.side-foot{padding:12px 16px;font-size:10.5px;color:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.15)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* letterhead */
.letterhead{background:var(--card);border-bottom:3px double var(--navy);padding:14px 26px 12px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lh-left{font-family:var(--serif)}
.lh-left .l1{font-size:12px;letter-spacing:.5px;color:var(--muted)}
.lh-left .l2{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.3px}
.lh-left .rule{width:120px;height:2px;background:var(--navy);margin-top:4px}
.lh-right{text-align:right;font-size:12px;color:var(--muted)}
.lh-right b{color:var(--ink)}
.content{padding:20px 26px 40px;flex:1}
.page-title{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--navy-deep);margin-bottom:2px}
.page-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:13px 15px}
.kpi .v{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--navy-deep)}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.kpi.gold{border-top-color:var(--gold)} .kpi.gold .v{color:var(--gold-ink)}
.kpi.green{border-top-color:var(--green)} .kpi.green .v{color:var(--green)}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;row-gap:8px}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:340px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--gold);background:var(--gold-soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-deep)}
.btn.ghost{background:none;border:none;color:var(--muted);padding:5px 7px;font-size:12px}
.btn.ghost:hover{color:var(--red)}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{border:none;background:none;padding:9px 15px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--red);background:var(--red-soft)}
.tabs button.active{color:var(--navy-deep);border-bottom-color:var(--navy)}

/* table */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 260px)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:600;font-size:12px;text-align:left;padding:10px 11px;white-space:nowrap;z-index:2;border-right:1px solid rgba(255,255,255,.15)}
thead th:last-child{border-right:none}
tbody td{padding:9px 11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;max-width:340px}
tbody td:last-child{border-right:none}
tbody td:first-child{border-right:1px solid var(--line)}
tbody tr:hover{background:var(--gold-soft)}
tbody tr:nth-child(even){background:#FBF9F4}
tbody tr:nth-child(even):hover{background:var(--gold-soft)}
td.num,th.num{text-align:center;width:44px}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
.count{font-size:12px;color:var(--muted);margin:8px 2px}

/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}
.b-navy{background:var(--navy-soft);color:var(--navy)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-gold{background:var(--gold-soft);color:var(--gold-ink)}
.b-gray{background:#EFEBE2;color:var(--muted)}

/* progress */
.prog{background:#EFEBE2;border-radius:20px;height:9px;min-width:90px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:20px}

/* bars chart */
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:10px 6px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.bar .col{width:100%;max-width:52px;background:linear-gradient(180deg,var(--navy),var(--navy-deep));border-radius:5px 5px 0 0;position:relative;min-height:4px}
.bar .val{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--navy-deep)}
.bar .lab{font-size:11px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin-bottom:7px;font-size:12.5px}
.hbar .track{background:#EFEBE2;border-radius:20px;height:11px;overflow:hidden}
.hbar .track>div{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:20px}
.hbar .n{font-family:var(--serif);font-weight:700;color:var(--navy-deep);text-align:right}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel h3{font-family:var(--serif);font-size:14.5px;color:var(--navy-deep);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}.sidebar{width:200px;min-width:200px}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(43,33,24,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .mh{background:var(--navy);color:#fff;padding:13px 18px;border-radius:12px 12px 0 0;font-family:var(--serif);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.modal .mh button{background:none;border:none;color:#fff;font-size:20px;line-height:1}
.modal .mb{padding:18px;display:grid;gap:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:64px;resize:vertical}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:normal;color:var(--ink)}

/* SHCB grid */
.shcb-cell{font-size:11.5px;line-height:1.3}
.shcb-cell .bc{color:var(--green);font-weight:700}
.mini{font-size:11px;color:var(--muted)}
.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
td.long{white-space:normal;word-break:break-word}
.toggle-cell{cursor:pointer;text-align:center;user-select:none;font-size:16px}
.note-banner{background:var(--gold-soft);border:1px solid #E8D9A8;border-radius:8px;padding:9px 14px;font-size:12.5px;color:#6b5410;margin-bottom:14px}
.saving{position:fixed;bottom:16px;right:20px;background:var(--ink);color:#fff;font-size:12px;padding:7px 14px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:99}
.saving.show{opacity:.92}
a.vlink{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--navy)}
@media print{.sidebar,.toolbar,.tabs{display:none}}
</style>
</head>

/* ====== CẤU HÌNH KẾT NỐI GOOGLE SHEET (dùng chung nhiều người) ======
   Dán URL /exec của Web App Apps Script vào GAS_URL để bật chế độ online.
   Để trống ('') = chạy offline (chỉ lưu trên máy này).                */
let GAS_URL = localStorage.getItem('dukv8-gas-url') || 'https://script.google.com/macros/s/AKfycbxyv0wzAzVsF6o2v7OGWNmukA9IAE3n5UH2Hsh5sxs9NuNtyKfU5fadHVkR3aB6yEjeDg/exec';
let ADMIN_PIN = sessionStorage.getItem('dukv8-pin') || '';

/* Ánh xạ khóa nội bộ (S.*) <-> tên bảng trên Google Sheet.
   Các phân hệ có cấu trúc lồng (m3, m7sinhoat, m7shcb) đồng bộ ở bản online
   theo dạng bảng phẳng; bản offline vẫn giữ cấu trúc cũ.               */
const SHEET_MAP = {
  m1:'M1_NhiemVu_VBDen', m2:'M2_VanBanDi',
  m4a:'M4a_QuanTriet_CapTren', m4b:'M4b_QuanTriet_DUKV8',
  m5:'M5_KetQua', m5next:'M5_NhiemVuThangSau',
  m6ct:'M6_ChuongTrinhKTGS', m6cuoc:'M6_CuocKTGS',
  m6kltren:'M6_KetLuanCapTren', m6klda:'M6_KetLuanDaThucHien',
  m7hop:'M7_HopBCH'
};

/* ================= STATE & STORAGE ================= */
let S = null;
const SKEY = 'dukv8-state-v3';
const ONLINE = ()=> !!GAS_URL;

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='__cb'+Date.now()+Math.floor(Math.random()*1e5);
    window[cb]=(d)=>{ resolve(d); delete window[cb]; s.remove(); };
    const s=document.createElement('script');
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    s.onerror=()=>{ reject(new Error('Không kết nối được Google Sheet')); s.remove(); };
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ reject(new Error('Hết thời gian chờ máy chủ')); delete window[cb]; s.remove(); } },20000);
  });
}

async function loadState(){
  S=null;
  if(ONLINE()){
    try{
      const res = await jsonp(GAS_URL+'?action=all');
      if(res && res.ok){
        S = JSON.parse(JSON.stringify(SEED));       // giữ khung + phần lồng
        // đổ dữ liệu phẳng từ Sheet vào các khóa đã ánh xạ
        for(const key in SHEET_MAP){
          const rows = res.data[SHEET_MAP[key]]||[];
          S[key] = rows.map(cleanRow);
        }
        rebuildNested();                            // dựng lại m3/m7 từ dữ liệu phẳng nếu có
        return;
      }
    }catch(e){ console.error(e); alert('Không tải được dữ liệu online: '+e.message+'\nTạm dùng dữ liệu trên máy.'); }
  }
  // offline
  try{ const r=await window.storage.get(SKEY); if(r&&r.value) S=JSON.parse(r.value); }catch(e){}
  if(!S) S=JSON.parse(JSON.stringify(SEED));
  for(const k in SEED){ if(!(k in S)) S[k]=JSON.parse(JSON.stringify(SEED[k])); }
}
function cleanRow(o){ const x={...o}; delete x.serverTime; return x; }
function rebuildNested(){ /* m3/m7 giữ theo SEED ở bản online giai đoạn đầu */ }

let saveTimer=null;
function save(){
  // offline: lưu localStorage; online: ghi trực tiếp qua saveRow (đã gọi tại chỗ sửa)
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    if(!ONLINE()){
      try{ await window.storage.set(SKEY, JSON.stringify(S)); toast('Đã lưu (trên máy)'); }
      catch(e){ console.error(e); }
    }
  },400);
}
function toast(msg){ const t=document.getElementById('saveToast'); t.textContent=msg||'Đã lưu'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }

/* Ghi 1 thao tác lên Google Sheet (add/update/delete) — chỉ ở chế độ online */
async function gasWrite(tableKey, op, row, id){
  const table = SHEET_MAP[tableKey]; if(!table) return {ok:true}; // khóa chưa ánh xạ -> bỏ qua
  if(!ADMIN_PIN){ const nguoi=getProposer(); if(nguoi===null||nguoi==='') return {ok:false}; try{ await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'propose',table,target_op:op,row,id,nguoi})}); }catch(e){} toast('Đã gửi đề xuất, chờ quản trị duyệt.'); return {ok:false,proposed:true}; }
  try{
    const r = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({pin:ADMIN_PIN, op, table, row, id})});
    const d = await r.json();
    if(!d.ok){ if(String(d.error).includes('PIN')){ sessionStorage.removeItem('dukv8-pin'); ADMIN_PIN=''; askPin(); } toast('Lỗi: '+d.error); }
    else toast('Đã lưu lên Google Sheet');
    return d;
  }catch(e){ toast('Lỗi kết nối: '+e.message); return {ok:false,error:e.message}; }
}
function askPin(){ const p=prompt('Nhập mã PIN quản trị để chỉnh sửa dữ liệu dùng chung:'); if(p){ ADMIN_PIN=p; sessionStorage.setItem('dukv8-pin',p); } }
function setupOnline(){
  const url=prompt('Dán URL Web App (…/exec) của Google Apps Script.\nĐể trống và bấm OK để CHUYỂN VỀ chế độ offline:', GAS_URL||'');
  if(url===null) return;
  GAS_URL=url.trim();
  if(GAS_URL) localStorage.setItem('dukv8-gas-url',GAS_URL); else localStorage.removeItem('dukv8-gas-url');
  location.reload();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){
  if(s===null||s===undefined||s==='') return '';
  const str=String(s).trim();
  // ISO datetime (từ Google Sheet): 2026-07-31T17:00:00.000Z -> dd/mm/yyyy
  let m=str.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  // ISO date thuần: 2026-07-31
  m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${String(m[3]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${m[1]}`;
  return str;
}
// Rút gọn về "tháng/năm" cho cột Tháng quán triệt
function fmtMonth(s){
  if(s===null||s===undefined||s==='') return '';
  const str=String(s).trim();
  let m=str.match(/^(\d{4})-(\d{2})-\d{2}/);      // ISO -> lấy tháng/năm
  if(m) return `${parseInt(m[2])}/${m[1]}`;
  m=str.match(/^(\d{1,2})[\/\-](\d{4})$/);         // đã đúng dạng m/yyyy
  if(m) return `${parseInt(m[1])}/${m[2]}`;
  return str;
}

/* ================= GENERIC TABLE ENGINE ================= */
/* colDefs: [{k,label,type:'text'|'textarea'|'select'|'date',opts,w,render}] */
function tableView(cfg){
  // cfg: {title, sub, dataKey (path in S), cols, filters:[{k,label,getOpts}], searchKeys, kpis(), extraToolbar, rowBadge}
  const el = document.getElementById('content');
  const state = { q:'', f:{} };
  function getData(){ return cfg.getData ? cfg.getData() : S[cfg.dataKey]; }
  function filtered(){
    let rows = getData().map((r,i)=>({...r,__i:i}));
    if(state.q){
      const q = state.q.toLowerCase();
      rows = rows.filter(r => (cfg.searchKeys||cfg.cols.map(c=>c.k)).some(k => String(r[k]||'').toLowerCase().includes(q)));
    }
    for(const fk in state.f){
      const v = state.f[fk];
      if(v) rows = rows.filter(r => cfg.filterMatch && cfg.filterMatch[fk] ? cfg.filterMatch[fk](r,v) : String(r[fk]||'')===v);
    }
    return rows;
  }
  function draw(){
    const rows = filtered();
    let html = `<div class="page-title">${cfg.title}</div><div class="page-sub">${cfg.sub||''}</div>`;
    if(cfg.beforeHTML) html += cfg.beforeHTML();
    html += `<div class="toolbar">
      <input type="search" placeholder="Tìm kiếm..." value="${esc(state.q)}" oninput="__tv.q(this.value)">`;
    (cfg.filters||[]).forEach(f=>{
      const opts = f.getOpts(getData());
      html += `<select onchange="__tv.f('${f.k}',this.value)">
        <option value="">— ${f.label} —</option>
        ${opts.map(o=>`<option ${state.f[f.k]===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    });
    html += `<button class="btn primary" onclick="__tv.add()">+ Thêm mới</button>
      <button class="btn" onclick="__tv.importClick()">⇪ Nhập Excel</button>
      <button class="btn" onclick="__tv.export()">⤓ Xuất Excel</button>
      <button class="btn" onclick="__tv.template()">📄 File mẫu</button>
      <button class="btn ghost" onclick="__tv.reset()">Khôi phục dữ liệu gốc</button>
      <input type="file" id="__imp" accept=".xlsx,.xls" style="display:none" onchange="__tv.importFile(this)">
    </div>
    <div class="count">Hiển thị <b>${rows.length}</b> / ${getData().length} dòng</div>
    <div class="tbl-wrap"><table><thead><tr><th class="num">TT</th>`;
    cfg.cols.forEach(c=> html += `<th ${c.w?`style="min-width:${c.w}px"`:''}>${c.label}</th>`);
    html += `<th style="width:76px"></th></tr></thead><tbody>`;
    if(!rows.length) html += `<tr><td colspan="${cfg.cols.length+2}"><div class="empty">Chưa có dữ liệu. Bấm “+ Thêm mới” để bắt đầu.</div></td></tr>`;
    rows.forEach((r,idx)=>{
      html += `<tr><td class="num">${idx+1}</td>`;
      cfg.cols.forEach(c=>{
        if(c.render){ html += `<td>${c.render(r)}</td>`; return; }
        const raw = fmtDate(r[c.k]);
        const long = c.type==='textarea' || (raw && String(raw).length>90);
        html += long ? `<td class="long"><div class="clamp" title="${esc(raw)}">${esc(raw)}</div></td>` : `<td>${esc(raw)}</td>`;
      });
      html += `<td style="white-space:nowrap"><button class="btn ghost" onclick="__tv.edit(${r.__i})">Sửa</button><button class="btn ghost" onclick="__tv.del(${r.__i})">Xóa</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
    el.innerHTML = html;
  }
  window.__tv = {
    q(v){ state.q=v; draw(); const inp=el.querySelector('input[type=search]'); inp.focus(); inp.setSelectionRange(v.length,v.length); },
    f(k,v){ state.f[k]=v; draw(); },
    add(){ openForm(cfg.formTitle||cfg.title, cfg.cols, {}, async (obj)=>{
      if(ONLINE() && cfg.dataKey){ const r=await gasWrite(cfg.dataKey,'add',obj); if(!r.ok) return; obj._id=r.id; }
      getData().push(obj); save(); draw();
    }); },
    edit(i){ const d=getData(); openForm('Chỉnh sửa', cfg.cols, d[i], async (obj)=>{
      if(ONLINE() && cfg.dataKey){ const r=await gasWrite(cfg.dataKey,'update',obj,d[i]._id); if(!r.ok) return; }
      Object.assign(d[i],obj); save(); draw();
    }); },
    del(i){ if(confirm('Xóa dòng này?')){ const d=getData();
      (async()=>{ if(ONLINE() && cfg.dataKey){ const r=await gasWrite(cfg.dataKey,'delete',null,d[i]._id); if(!r.ok) return; } d.splice(i,1); save(); draw(); })();
    } },
    export(){ exportRows(cfg.title, cfg.cols, filtered()); },
    template(){ downloadTemplate(cfg.title, cfg.cols); },
    importClick(){ document.getElementById('__imp').click(); },
    importFile(inp){ const f=inp.files[0]; if(!f) return;
      importExcel(f, cfg.cols, async (records)=>{
        if(!records.length){ alert('Không đọc được dòng dữ liệu nào. Kiểm tra lại file mẫu.'); return; }
        if(!confirm(`Đã đọc ${records.length} dòng từ Excel. Thêm vào danh mục hiện tại?`)) { inp.value=''; return; }
        const d=getData();
        if(ONLINE() && cfg.dataKey){
          if(!ADMIN_PIN){ askPin(); if(!ADMIN_PIN){ inp.value=''; return; } }
          toast('Đang tải lên Google Sheet...');
          for(const rec of records){ const r=await gasWrite(cfg.dataKey,'add',rec); if(r&&r.ok){ rec._id=r.id; d.push(rec); } }
          toast(`Đã nhập ${records.length} dòng lên Google Sheet`);
        } else {
          records.forEach(rec=>d.push(rec)); save(); toast(`Đã nhập ${records.length} dòng`);
        }
        inp.value=''; draw();
      }, (err)=>{ alert('Lỗi đọc Excel: '+err); inp.value=''; });
    },
    reset(){ if(confirm('Khôi phục dữ liệu gốc của phân hệ này? Các chỉnh sửa sẽ mất.')){
      (async()=>{ if(ONLINE() && cfg.dataKey){ const r=await gasWrite(cfg.dataKey,'reset'); if(!r.ok) return; await loadState(); } else { resetKey(cfg.dataKey, cfg.getData, cfg.setData); } VIEWS[CUR](); })();
    } }
  };
  draw();
}

/* ===== NHẬP / FILE MẪU EXCEL ===== */
function normHeader(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim(); }
function importExcel(file, cols, onOk, onErr){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      // tìm dòng header: dòng chứa nhiều nhãn cột khớp cfg.cols nhất
      const labels=cols.map(c=>normHeader(c.label)).filter(Boolean);
      const match=(cell,lab)=>{ if(!cell||!lab) return false; return cell===lab || (cell.length>=4&&lab.includes(cell)) || (lab.length>=4&&cell.includes(lab)); };
      let hi=-1, best=0;
      for(let i=0;i<Math.min(aoa.length,15);i++){
        const cells=aoa[i].map(normHeader).filter(Boolean);
        const score=cells.filter(c=>labels.some(l=>match(c,l))).length;
        if(score>best){best=score;hi=i;}
      }
      if(hi<0||best<2){ onErr('Không tìm thấy dòng tiêu đề khớp mẫu.'); return; }
      const hdr=aoa[hi].map(normHeader);
      // map cột Excel -> khóa
      const colIdx={};
      cols.forEach(c=>{
        const cands=[normHeader(c.label), ...((c.aliases||[]).map(normHeader))];
        let idx=-1;
        for(const l of cands){ idx=hdr.findIndex(h=>h===l); if(idx>=0) break; }
        if(idx<0){ for(const l of cands){ idx=hdr.findIndex(h=>match(h,l)); if(idx>=0) break; } }
        if(idx>=0) colIdx[c.k]=idx;
      });
      const recs=[];
      for(let i=hi+1;i<aoa.length;i++){
        const row=aoa[i]; if(!row||row.every(x=>String(x).trim()===''))continue;
        const rec={}; let has=false;
        cols.forEach(c=>{ const idx=colIdx[c.k]; if(idx!==undefined){ const v=String(row[idx]??'').trim(); rec[c.k]=v; if(v)has=true; }});
        if(has) recs.push(rec);
      }
      onOk(recs);
    }catch(err){ onErr(String(err)); }
  };
  reader.onerror=()=>onErr('Không đọc được tệp');
  reader.readAsArrayBuffer(file);
}
function downloadTemplate(name, cols){
  const headers=cols.map(c=>c.label);
  const example=cols.map(c=>c.type==='select'&&c.opts?c.opts[0]:'');
  const aoa=[
    [name.toUpperCase()+' — FILE MẪU NHẬP LIỆU'],
    ['Giữ nguyên dòng tiêu đề bên dưới; nhập dữ liệu từ dòng trống kế tiếp. Cột select nên nhập đúng giá trị gợi ý.'],
    [],
    headers,
    example
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:headers.length-1}},{s:{r:1,c:0},e:{r:1,c:headers.length-1}}];
  ws['!cols']=headers.map(h=>({wch:/trích yếu|nội dung|nhiệm vụ|chỉ đạo/i.test(h)?42:18}));
  const NAVY='FF21409A';
  const hr=3;
  headers.forEach((h,c)=>{ const a=XLSX.utils.encode_cell({r:hr,c}); if(ws[a]) ws[a].s={font:{bold:true,color:{rgb:'FFFFFFFF'}},fill:{patternType:'solid',fgColor:{rgb:NAVY}},alignment:{horizontal:'center',wrapText:true},border:{top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}}}; });
  const a0=XLSX.utils.encode_cell({r:0,c:0}); if(ws[a0]) ws[a0].s={font:{bold:true,sz:13,color:{rgb:NAVY}}};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Mẫu');
  const fn='Mau_'+name.replace(/[·.]/g,'').replace(/[^\wÀ-ỹ ]/g,'').trim().replace(/\s+/g,'_').slice(0,36)+'.xlsx';
  XLSX.writeFile(wb,fn,{cellStyles:true});
}
function resetKey(dataKey, getData, setData){
  if(setData){ setData(); }
  else { S[dataKey] = JSON.parse(JSON.stringify(SEED[dataKey])); }
  save();
}
function exportRows(name, cols, rows){
  const headers = ['TT', ...cols.map(c=>c.label)];
  const body = rows.map((r,i)=>[ i+1, ...cols.map(c=> c.exportVal? c.exportVal(r) : fmtDate(r[c.k]||'')) ]);
  // Khối tiêu đề cơ quan
  const today = new Date();
  const dstr = `ngày ${today.getDate()} tháng ${today.getMonth()+1} năm ${today.getFullYear()}`;
  const aoa = [
    ['ĐẢNG ỦY CHI CỤC HẢI QUAN KHU VỰC VIII'],
    ['VĂN PHÒNG ĐẢNG ỦY'],
    [],
    [name.toUpperCase()],
    [`Quảng Ninh, ${dstr}`],
    [],
    headers,
    ...body
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const ncol = headers.length;
  const lastRowIdx = aoa.length; // 1-based number of rows
  // Gộp ô cho các dòng tiêu đề
  ws['!merges'] = [
    {s:{r:0,c:0},e:{r:0,c:ncol-1}},
    {s:{r:1,c:0},e:{r:1,c:ncol-1}},
    {s:{r:3,c:0},e:{r:3,c:ncol-1}},
    {s:{r:4,c:0},e:{r:4,c:ncol-1}},
  ];
  // Độ rộng cột: TT hẹp, cột nội dung rộng
  ws['!cols'] = headers.map((h,ci)=>{
    if(ci===0) return {wch:5};
    const c = cols[ci-1]||{};
    let w = 18;
    if(c.type==='textarea') w = 42;
    if(/trích yếu|nội dung|nhiệm vụ|chỉ đạo/i.test(h)) w = 46;
    if(/số|ngày|tháng|năm|thời hạn|trạng thái|loại|mật|quý/i.test(h)) w = 14;
    return {wch:w};
  });
  const HEADER_ROW = 6; // 0-based index của dòng header (aoa[6])
  const range = XLSX.utils.decode_range(ws['!ref']);
  const NAVY='FF21409A', WHITE='FFFFFFFF';
  const thin = {style:'thin', color:{rgb:'FFBFBFBF'}};
  const borderAll = {top:thin,bottom:thin,left:thin,right:thin};
  for(let R=range.s.r; R<=range.e.r; R++){
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({r:R,c:C});
      let cell = ws[addr];
      if(!cell){ cell = ws[addr] = {t:'s', v:''}; }
      cell.s = cell.s || {};
      if(R===0){ cell.s={font:{bold:true,sz:13,color:{rgb:NAVY}},alignment:{horizontal:'center'}}; }
      else if(R===1){ cell.s={font:{bold:true,sz:11,color:{rgb:NAVY}},alignment:{horizontal:'center'}}; }
      else if(R===3){ cell.s={font:{bold:true,sz:14},alignment:{horizontal:'center'}}; }
      else if(R===4){ cell.s={font:{italic:true,sz:10},alignment:{horizontal:'center'}}; }
      else if(R===HEADER_ROW){ cell.s={font:{bold:true,color:{rgb:WHITE},sz:11},fill:{patternType:'solid',fgColor:{rgb:NAVY}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:borderAll}; }
      else if(R>HEADER_ROW){
        const isNum = (C===0);
        cell.s={alignment:{horizontal:isNum?'center':'left',vertical:'top',wrapText:true},border:borderAll,font:{sz:10.5}};
      }
    }
  }
  // chiều cao dòng header
  ws['!rows']=[]; ws['!rows'][HEADER_ROW]={hpt:28};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dữ liệu');
  const fn = name.replace(/[·.]/g,'').replace(/[^\wÀ-ỹ ]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  XLSX.writeFile(wb, fn+'.xlsx', {cellStyles:true});
}
function openForm(title, cols, obj, onOk){
  const bg=document.getElementById('modalBg'), box=document.getElementById('modalBox');
  let html = `<div class="mh">${title}<button onclick="closeModal()">×</button></div><div class="mb">`;
  cols.filter(c=>!c.noEdit).forEach(c=>{
    const raw = obj[c.k]; const v = esc(Array.isArray(raw)?raw.join('\n'):(raw||''));
    html += `<div class="field"><label>${c.label}</label>`;
    if(c.type==='textarea') html += `<textarea data-k="${c.k}">${v}</textarea>`;
    else if(c.type==='select') html += `<select data-k="${c.k}"><option value=""></option>${c.opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else html += `<input data-k="${c.k}" value="${v}">`;
    html += `</div>`;
  });
  html += `</div><div class="mf"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" id="mOk">Lưu</button></div>`;
  box.innerHTML = html; bg.classList.add('open');
  document.getElementById('mOk').onclick = ()=>{
    const out={};
    box.querySelectorAll('[data-k]').forEach(inp=>{ let v=inp.value.trim(); if(inp.dataset.k==='duthao') v=v?v.split(/\n+/).map(s=>s.trim()).filter(Boolean):[]; out[inp.dataset.k]=v; });
    onOk(out); closeModal();
  };
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });

    document.getElementById('dz').innerHTML='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#21409A;color:#fff"><th style="padding:7px">Thời gian</th><th>Người gửi</th><th>Bảng</th><th>Thao tác</th><th>Nội dung đề xuất</th><th>Xử lý</th></tr>'+rows.map(r=>{
      let noi=''; try{ noi=Object.entries(JSON.parse(r.dulieu||'{}')).filter(([k,v])=>v).slice(0,5).map(([k,v])=>`<b>${k}</b>: ${String(v).slice(0,60)}`).join('<br>'); }catch(e){ noi=String(r.dulieu||''); }
      const tt={add:'Thêm',update:'Sửa',delete:'Xóa'}[r.thaotac]||r.thaotac;
      return `<tr style="border-bottom:1px solid #e3e6ea;vertical-align:top"><td style="padding:7px;white-space:nowrap">${(typeof fmtDate==='function')?fmtDate(r.thoigian):esc8(r.thoigian)}</td><td style="padding:7px">${esc8(r.nguoi)}</td><td style="padding:7px;white-space:nowrap">${esc8(r.bang)}</td><td style="padding:7px">${tt}</td><td style="padding:7px;max-width:380px">${noi}</td><td style="padding:7px;white-space:nowrap"><button class="btn" style="background:#1E7D3A;color:#fff;padding:3px 9px;border:none;border-radius:5px;cursor:pointer" onclick="duyetDeXuat('${r._id}','approve')">Duyệt</button> <button class="btn" style="background:#c0392b;color:#fff;padding:3px 9px;border:none;border-radius:5px;cursor:pointer" onclick="duyetDeXuat('${r._id}','reject')">Từ chối</button></td></tr>`;
    }).join('')+'</table>';
  }).catch(e=>{ document.getElementById('dz').innerHTML='<div style="color:#c0392b">Lỗi tải danh sách: '+e+'</div>'; });
};
function esc8(t){return String(t==null?'':t);}
async function duyetDeXuat(id,op){
  if(!ADMIN_PIN){ toast('Cần đăng nhập quản trị'); return; }
  if(op==='reject' && !confirm('Từ chối và bỏ đề xuất này?')) return;
  try{ await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:ADMIN_PIN,op,id})}); }catch(e){}
  toast(op==='approve'?'Đã duyệt và cập nhật vào sổ.':'Đã từ chối đề xuất.');
  if(op==='approve'){ try{ await loadState(); }catch(e){} }
  VIEWS.duyet();
}

function m6TienDoView(tabsHTML){
  const el=document.getElementById('content');
  const kh = S.m6kehoachnam.soCuocKH||0;
  const byCB={};
  S.m6cuoc.forEach(c=>{
    const key=c.doituong||'(chưa xác định)';
    if(!byCB[key]) byCB[key]={cuoc:0,done:0,items:[]};
    byCB[key].cuoc++; if(c.trangthai==='Hoàn thành') byCB[key].done++;
    byCB[key].items.push(c);
  });
  const tong=S.m6cuoc.length, tongDone=S.m6cuoc.filter(c=>c.trangthai==='Hoàn thành').length;
  const pctKH = kh?Math.min(100,Math.round(tong/kh*100)):0;
  let html=`<div class="page-title">Phân hệ 6 · Tiến độ kiểm tra, giám sát các chi bộ</div>
  <div class="page-sub">So sánh số cuộc đã triển khai / hoàn thành với kế hoạch năm đề ra</div>
  ${tabsHTML()}
  <div class="kpis">
    <div class="kpi"><div class="v">${kh}</div><div class="l">Số cuộc theo kế hoạch năm <button class="btn ghost" onclick="m6EditKH()">sửa</button></div></div>
    <div class="kpi gold"><div class="v">${tong}</div><div class="l">Số cuộc đã triển khai (${pctKH}% kế hoạch)</div></div>
    <div class="kpi green"><div class="v">${tongDone}</div><div class="l">Số cuộc đã hoàn thành, ban hành kết luận</div></div>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th class="num">TT</th><th style="min-width:180px">Chi bộ / đối tượng</th><th style="min-width:280px">Nội dung KTGS</th><th>Kết luận</th><th style="min-width:150px">Tỷ lệ hoàn thành hồ sơ</th><th>Trạng thái</th></tr></thead><tbody>`;
  let idx=0;
  for(const cb in byCB){
    byCB[cb].items.forEach(c=>{
      idx++;
      const done=HOSO_STEPS.filter(([k])=>c.hoso&&c.hoso[k]).length;
      const pct=Math.round(done/7*100);
      const kl=(c.hoso&&c.hoso.tbkl)?'<span class="badge b-green">Đã ban hành</span>':'<span class="badge b-gray">Chưa</span>';
      const stBadge=c.trangthai==='Hoàn thành'?'b-green':(c.trangthai==='Đang tiến hành'?'b-amber':'b-gray');
      html+=`<tr><td class="num">${idx}</td><td><b>${esc(cb)}</b><div class="mini">${esc(c.so)} · ${esc(c.loaikt)} · ${esc(c.chuthe)}</div></td>
      <td>${esc(c.noidung)}</td><td>${kl}</td>
      <td><div class="prog"><div style="width:${pct}%"></div></div><span class="mini">${pct}%</span></td>
      <td><span class="badge ${stBadge}">${esc(c.trangthai)}</span></td></tr>`;
    });
  }
  if(!idx) html+=`<tr><td colspan="6"><div class="empty">Chưa có cuộc KTGS nào — bổ sung tại thẻ “Cuộc KTGS năm hiện tại”.</div></td></tr>`;
  html+=`</tbody></table></div>`;
  el.innerHTML=html;
  window.m6EditKH=()=>{ const v=prompt('Số cuộc KTGS theo kế hoạch năm:',kh); if(v!==null){S.m6kehoachnam.soCuocKH=parseInt(v)||0;save();VIEWS.m6();} };
}

function m7SHCBView(tabsHTML){
  const el=document.getElementById('content');
  const year='2026';
  function key(cb,m){ return year+'|'+cb+'|'+m; }
  function draw(){
    let html=`<div class="page-title">Phân hệ 7 · Theo dõi sinh hoạt định kỳ 13 chi bộ năm ${year}</div>
    <div class="page-sub">Bấm vào ô để đánh dấu: ✓ đã sinh hoạt (có biên bản) · ✕ chưa sinh hoạt · trống = chưa đến kỳ</div>
    ${tabsHTML()}`;
    const months=[...Array(12).keys()].map(i=>i+1);
    // KPI
    const doneCount=Object.values(S.m7sinhoat).filter(v=>v==='done').length;
    html+=`<div class="kpis">
      <div class="kpi green"><div class="v">${doneCount}</div><div class="l">Lượt sinh hoạt đã thực hiện (có biên bản) năm ${year}</div></div>
      <div class="kpi"><div class="v">13</div><div class="l">Chi bộ trực thuộc Đảng bộ Chi cục</div></div>
    </div>

    S.chibo13.forEach(cb=>{
      let cnt=0;
      html+=`<tr><td><b>${esc(cb)}</b></td>`;
      months.forEach(m=>{
        const v=S.m7sinhoat[key(cb,m)];
        if(v==='done')cnt++;
        const sym=v==='done'?'✓':(v==='miss'?'✕':'·');
        const col=v==='done'?'var(--green)':(v==='miss'?'var(--red)':'var(--line)');
        html+=`<td class="toggle-cell" style="color:${col};font-weight:700" onclick="m7Toggle('${esc(cb)}',${m})" title="${cb} - Tháng ${m}">${sym}</td>`;
      });
      html+=`<td class="num"><span class="badge ${cnt>=6?'b-green':'b-amber'}">${cnt}/12</span></td></tr>`;
    });
    html+=`</tbody></table></div>
    <div class="note-banner">Theo Quy định, chi bộ sinh hoạt định kỳ mỗi tháng 1 lần. Ô đánh dấu ✕ (chưa sinh hoạt/chậm nộp biên bản) cần đôn đốc trước kỳ giao ban tháng kế tiếp.</div>`;
    el.innerHTML=html;
  }
  window.m7Toggle=(cb,m)=>{
    const k=key(cb,m); const cur=S.m7sinhoat[k];
    S.m7sinhoat[k] = cur==='done'?'miss':(cur==='miss'?'':'done');
    if(S.m7sinhoat[k]==='') delete S.m7sinhoat[k];
    save(); draw();
  };
  draw();
}

  html+=`</tbody></table></div>
  <div class="note-banner">Sau khi dự sinh hoạt, đảng ủy viên gửi báo cáo về Văn phòng Đảng ủy — bấm vào ô phân công để đánh dấu ✓ đã có báo cáo. Ô nền vàng: đã phân công, chưa có báo cáo.</div>`;
  el.innerHTML=html;
  window.m7ToggleBC=(i,m)=>{ const a=S.m7shcb[i].pc[m]; if(a){ a.bc=!a.bc; save(); VIEWS.m7(); } };
  window.m7ExportCheo=()=>{
    const rows=S.m7shcb.map((mb,i)=>{
      const o={TT:i+1,'Họ và tên':mb.ten,'Chức vụ':mb.chucvu,'Chi bộ SH thường kỳ':mb.chibo};
      months.forEach(m=>{const a=mb.pc[String(m)];o['T'+m]=a?(a.cb+(a.bc?' (đã BC)':'')):'';});
      return o;
    });
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'SinhHoatCheo');XLSX.writeFile(wb,'PhanCong_SinhHoatCheo_2026.xlsx');
  };
}
